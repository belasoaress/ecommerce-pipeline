ecommerce_gold:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: 5432
      dbname: "{{ env_var('POSTGRES_DB', 'ecommerce') }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      schema: gold        # schema padrão de saída
      threads: 4
      connect_timeout: 10